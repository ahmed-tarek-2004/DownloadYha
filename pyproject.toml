[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "downloadyha"
version = "2.0.0"

description = "A modern video, audio, and playlist downloader CLI and GUI for YouTube & Social Media"

readme = "README.md"

requires-python = ">=3.13"

dependencies = [
    "yt-dlp>=2026.8.19",
    "curl_cffi>=0.7.0",
    "certifi>=2024.0.0",
]


[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
]
gui = [
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
]


[project.scripts]
downloadyha = "downloadyha.cli:main"
downloadyha-gui = "downloadyha_gui.app:main"


[tool.setuptools.packages.find]
where = ["src"]
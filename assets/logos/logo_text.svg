<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D2FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9B51E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC50FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Downloadyha text -->
  <text x="50%" y="50%"
        font-family="Arial, sans-serif"
        font-size="80"
        font-weight="bold"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="url(#textGradient)">
    Downloadyha
  </text>

  <!-- Tagline -->
  <text x="50%" y="75%"
        font-family="Arial, sans-serif"
        font-size="24"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#9B51E0">
    Fast &amp; Beautiful YouTube Downloader
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="placeholderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="180" fill="url(#placeholderGrad)"/>

  <!-- Play icon -->
  <circle cx="160" cy="90" r="40" fill="#00D2FF" opacity="0.3"/>
  <polygon points="150,75 150,105 180,90" fill="#00D2FF"/>

  <!-- Video icon in corner -->
  <rect x="10" y="10" width="40" height="28" rx="4" fill="#00D2FF" opacity="0.5"/>
  <circle cx="20" cy="20" r="4" fill="#FFFFFF"/>
  <circle cx="34" cy="28" r="3" fill="#FFFFFF"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D2FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9B51E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC50FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGradient)"/>

  <!-- Video play symbol background -->
  <rect x="128" y="96" width="256" height="192" rx="24" ry="24" fill="#FFFFFF" opacity="0.9"/>

  <!-- Play triangle -->
  <polygon points="200,140 200,240 300,190" fill="url(#bgGradient)"/>

  <!-- Download arrow -->
  <g transform="translate(0, 0)">
    <!-- Arrow shaft -->
    <rect x="236" y="300" width="40" height="120" rx="8" ry="8" fill="url(#arrowGradient)"/>

    <!-- Arrow head (pointing down) -->
    <polygon points="256,440 180,360 332,360" fill="url(#arrowGradient)"/>

    <!-- Download tray line -->
    <rect x="140" y="450" width="232" height="16" rx="8" ry="8" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>

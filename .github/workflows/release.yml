name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Matches semantic version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required for creating releases and uploading assets

jobs:
  # CLI Build Jobs
  build-cli:
    name: Build CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            python-arch: x64
            artifact: downloadyha-windows-x86_64.zip
          - target: linux-x64
            os: ubuntu-latest
            python-arch: x64
            artifact: downloadyha-linux-x86_64.tar.gz
          - target: linux-arm64
            os: ubuntu-latest
            python-arch: x64  # Cross-compilation setup
            artifact: downloadyha-linux-arm64.tar.gz
            cross-compile: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}

      - name: Sync package version from tag
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "Syncing version $CLEAN_VER across codebase..."
          python -c "
          import re, json
          from pathlib import Path

          ver = '$CLEAN_VER'

          init_py = Path('src/downloadyha/__init__.py')
          if init_py.exists():
              content = init_py.read_text(encoding='utf-8')
              content = re.sub(r'__version__\s*=\s*[\"\x27].*?[\"\x27]', f'__version__ = \"{ver}\"', content)
              init_py.write_text(content, encoding='utf-8')

          gui_init_py = Path('src/downloadyha_gui/__init__.py')
          if gui_init_py.exists():
              content = gui_init_py.read_text(encoding='utf-8')
              content = re.sub(r'__version__\s*=\s*[\"\x27].*?[\"\x27]', f'__version__ = \"{ver}\"', content)
              gui_init_py.write_text(content, encoding='utf-8')

          v_json = Path('src/downloadyha/versions.json')
          if v_json.exists():
              data = json.loads(v_json.read_text(encoding='utf-8'))
              data['downloadyha'] = ver
              v_json.write_text(json.dumps(data, indent=2), encoding='utf-8')

          p_toml = Path('pyproject.toml')
          if p_toml.exists():
              content = p_toml.read_text(encoding='utf-8')
              content = re.sub(r'version\s*=\s*[\"\x27].*?[\"\x27]', f'version = \"{ver}\"', content, count=1)
              p_toml.write_text(content, encoding='utf-8')
          "

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0.0

      - name: Install project dependencies
        run: |
          pip install -e .

      - name: Set up cross-compilation environment (Linux ARM64)
        if: matrix.cross-compile == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build CLI executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller downloadyha.spec
          $version = "${{ steps.get_version.outputs.version }}"
          $zipName = "downloadyha-${version}-windows-x86_64.zip"
          Compress-Archive -Path "dist\downloadyha.exe" -DestinationPath $zipName
          Copy-Item $zipName "downloadyha-windows-x86_64.zip"
          Copy-Item $zipName "downloadyha-windows.zip"

      - name: Build CLI executable (Linux x64)
        if: runner.os == 'Linux' && matrix.cross-compile != true
        run: |
          pyinstaller downloadyha.spec
          version="${{ steps.get_version.outputs.version }}"
          tarName="downloadyha-${version}-linux-x86_64.tar.gz"
          tar -czvf "$tarName" -C dist downloadyha
          cp "$tarName" downloadyha-linux-x86_64.tar.gz
          cp "$tarName" downloadyha-linux.tar.gz

      - name: Build CLI executable (Linux ARM64 cross-compile)
        if: matrix.cross-compile == true
        run: |
          pyinstaller downloadyha.spec || pyinstaller downloadyha.spec
          version="${{ steps.get_version.outputs.version }}"
          tarName="downloadyha-${version}-linux-arm64.tar.gz"
          tar -czvf "$tarName" -C dist downloadyha
          cp "$tarName" downloadyha-linux-arm64.tar.gz

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error
          retention-days: 1

  # GUI Build Jobs
  build-gui:
    name: Build GUI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            python-arch: x64
          - target: linux-x64
            os: ubuntu-latest
            python-arch: x64
          - target: linux-arm64
            os: ubuntu-latest
            python-arch: x64  # Cross-compilation setup
            cross-compile: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}

      - name: Sync package version from tag
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "Syncing version $CLEAN_VER across codebase..."
          python -c "
          import re, json
          from pathlib import Path

          ver = '$CLEAN_VER'

          init_py = Path('src/downloadyha/__init__.py')
          if init_py.exists():
              content = init_py.read_text(encoding='utf-8')
              content = re.sub(r'__version__\s*=\s*[\"\x27].*?[\"\x27]', f'__version__ = \"{ver}\"', content)
              init_py.write_text(content, encoding='utf-8')

          gui_init_py = Path('src/downloadyha_gui/__init__.py')
          if gui_init_py.exists():
              content = gui_init_py.read_text(encoding='utf-8')
              content = re.sub(r'__version__\s*=\s*[\"\x27].*?[\"\x27]', f'__version__ = \"{ver}\"', content)
              gui_init_py.write_text(content, encoding='utf-8')

          v_json = Path('src/downloadyha/versions.json')
          if v_json.exists():
              data = json.loads(v_json.read_text(encoding='utf-8'))
              data['downloadyha'] = ver
              v_json.write_text(json.dumps(data, indent=2), encoding='utf-8')

          p_toml = Path('pyproject.toml')
          if p_toml.exists():
              content = p_toml.read_text(encoding='utf-8')
              content = re.sub(r'version\s*=\s*[\"\x27].*?[\"\x27]', f'version = \"{ver}\"', content, count=1)
              p_toml.write_text(content, encoding='utf-8')
          "

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0.0

      - name: Install project dependencies (with GUI extras)
        run: |
          pip install -e ".[gui]"

      - name: Set up cross-compilation environment (Linux ARM64)
        if: matrix.cross-compile == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build GUI executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller downloadyha-gui.spec
          $version = "${{ steps.get_version.outputs.version }}"
          $zipName = "downloadyha-gui-${version}-windows-x86_64.zip"
          Compress-Archive -Path "dist\downloadyha-gui.exe" -DestinationPath $zipName
          Copy-Item $zipName "downloadyha-gui-windows.zip"
          Copy-Item $zipName "downloadyha-gui-windows-x86_64.zip"

      - name: Build GUI executable (Linux x64)
        if: runner.os == 'Linux' && matrix.cross-compile != true
        run: |
          pyinstaller downloadyha-gui.spec
          version="${{ steps.get_version.outputs.version }}"
          tarName="downloadyha-gui-${version}-linux-x86_64.tar.gz"
          tar -czvf "$tarName" -C dist downloadyha-gui
          cp "$tarName" downloadyha-gui-linux-x86_64.tar.gz
          cp "$tarName" downloadyha-gui-linux.tar.gz

      - name: Build GUI executable (Linux ARM64 cross-compile)
        if: matrix.cross-compile == true
        run: |
          pyinstaller downloadyha-gui.spec || pyinstaller downloadyha-gui.spec
          version="${{ steps.get_version.outputs.version }}"
          tarName="downloadyha-gui-${version}-linux-arm64.tar.gz"
          tar -czvf "$tarName" -C dist downloadyha-gui
          cp "$tarName" downloadyha-gui-linux-arm64.tar.gz

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec mv {} release-assets/ \;

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix from tag (v1.0.0 -> 1.0.0)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
